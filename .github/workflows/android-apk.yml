name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Sync Static Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/static/js android/app/src/main/assets/static/css android/app/src/main/assets/static/samples/pratos
          cp -r app/static/* android/app/src/main/assets/
          cp -r app/static/* android/app/src/main/assets/static/

      - name: Generate Gradle Wrapper & Build APKs
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Release Artifacts
        run: |
          # Extract version from tag (e.g. v1.0.0 -> 1.0.0) or default to 1.0.0
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          # Copy release APK with versioned name NutriScan-v${VERSION}.apk
          cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/NutriScan-v${VERSION}.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriScan-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriScan-Android-release
          path: android/app/build/outputs/apk/release/NutriScan-v*.apk
          retention-days: 14

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/NutriScan-v${{ env.VERSION }}.apk
          name: NutriScan ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ### 📱 NutriScan Android APK
            Versões oficiais prontas para instalação direta no celular Android.

            - **Release Oficial:** `NutriScan-v${{ env.VERSION }}.apk` (APK assinado e otimizado com ProGuard/R8)
            - **Debug APK:** `app-debug.apk` (para testes com logs e depuração)
            - **Novidades:**
              - Splash Screen nativa com fundo Bento `#090d16` e ícone centralizado (zero flash branco)
              - JavaScript Interface `NutriScanNative` com haptic feedback nativo (`vibrate`) e compartilhamento nativo (`shareText`)
              - Interface Edge-to-Edge nativa e compatibilidade offline total
